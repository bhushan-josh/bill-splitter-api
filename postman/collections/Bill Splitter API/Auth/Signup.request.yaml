$kind: http-request
description: Create an account and receive a JWT. Username/phone use dynamic values so it is re-runnable.
url: "{{baseUrl}}/api/v1/signup"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Ada Lovelace",
      "username": "user{{$timestamp}}",
      "phone": "+1{{$timestamp}}",
      "password": "secret1",
      "password_confirmation": "secret1"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.success) {
        pm.collectionVariables.set('token', res.data.token);
        pm.collectionVariables.set('userId', res.data.user.id);
        console.log('Saved token for user', res.data.user.username);
      }
    language: text/javascript
order: 1000
