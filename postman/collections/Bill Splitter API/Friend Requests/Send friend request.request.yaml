$kind: http-request
description: Send a request. Set `receiverId` to another user's id.
url: "{{baseUrl}}/api/v1/friend_requests"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "receiver_id": {{receiverId}}
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.success) { pm.collectionVariables.set('friendRequestId', res.data.id); }
    language: text/javascript
order: 1000
