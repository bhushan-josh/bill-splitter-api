require:
  - rubocop-rails
  - rubocop-performance
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "db/migrate/**/*"
    - "config/**/*"
    - "vendor/**/*"
    - "tmp/**/*"
    - "storage/**/*"
    - "node_modules/**/*"

# --- Style -----------------------------------------------------------------
Style/Documentation:
  Enabled: false

# Match modern Rails (omakase) conventions used by the generators.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

# --- Metrics ---------------------------------------------------------------
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "config/routes.rb"

# Serializers/presenters are declarative attribute mappings; ABC/length limits
# are noise there.
Metrics/AbcSize:
  Exclude:
    - "app/serializers/**/*"
    - "app/presenters/**/*"

Metrics/MethodLength:
  Max: 20
  Exclude:
    - "app/serializers/**/*"
    - "app/presenters/**/*"

Layout/LineLength:
  Max: 120

# --- RSpec -----------------------------------------------------------------
RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 5

# --- Rails -----------------------------------------------------------------
Rails:
  Enabled: true

# Inline validation messages are fine; revisit if/when i18n is introduced.
Rails/I18nLocaleTexts:
  Enabled: false
